# Backend Staging Docker Compose
# Backend API with Redis cache and hot reload support
# Run independently or with frontend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.staging
    image: ast-tools-backend:staging
    container_name: ast-tools-backend
    restart: unless-stopped
    # Use host network to access PostgreSQL and Redis on the host/network
    # This matches the Django project setup
    network_mode: "host"
    environment:
      - PYTHONPATH=/app/src
      - DUT_API_BASE_URL=http://172.18.220.56:9001
      # Hot reload pins uvicorn to a single worker, so every request queues behind
      # the slowest one. Use "--reload --reload-dir /app/src" when editing code live.
      - UVICORN_ARGS=${UVICORN_ARGS:---workers 4}
    env_file:
      - .env.staging
    volumes:
      # Mount source code for hot reload (writable for temp files/logs)
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./static:/app/static
      - ./.env.staging:/app/.env.staging
      # Persistent data volumes
      - upload_data:/app/uploads
      - log_data:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        # Log rotation settings for backend service
        max-size: "20m"
        max-file: "3"
        labels: "service=backend-api"
    labels:
      - "com.ast-tools.service=backend"
      - "com.ast-tools.environment=staging"
      - "com.ast-tools.hot-reload=enabled"
    # Migrations run automatically on startup
    command: >-
      sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 7070 $$UVICORN_ARGS"

volumes:
  upload_data:
    driver: local
  log_data:
    driver: local
